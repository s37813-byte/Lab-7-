
name: Build .NET project

'on':
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOTNET_VERSION: 10.0.x

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Confirm runner
        shell: bash
        run: echo "Runner is ready"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Lab-7.csproj

      - name: Build project
        run: dotnet build Lab-7.csproj --no-restore

      - name: Run project
        run: dotnet run --project Lab-7.csproj --no-build
